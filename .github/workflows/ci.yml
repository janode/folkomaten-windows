name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    # WPF bygger og tester bare på Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Bygg
        run: dotnet build Folkomaten.slnx -c Release -warnaserror

      # global.json i rota velger testkjøreren (Microsoft.Testing.Platform).
      - name: Test
        run: dotnet test --project tests/Folkomaten.Tests/Folkomaten.Tests.csproj -c Release --no-build
